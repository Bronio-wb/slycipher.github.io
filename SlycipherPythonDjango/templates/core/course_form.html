<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{% if course %}Editar{% else %}Crear{% endif %} Curso</title>
  </head>
  <body>
    <h1>{% if course %}Editar{% else %}Crear{% endif %} Curso</h1>
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar</button>
    </form>
    <p><a href="{% url 'core:course_list' %}">Volver a la lista</a></p>
  </body>
</html>
